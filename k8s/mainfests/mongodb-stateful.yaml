apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: manage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-pod
  serviceName: mongo-service
  template:
    metadata:
      name: mongo-pod
      namespace: manage
      labels:
        app: mongo-pod
    spec:
      containers:
        - name: mongo-image
          image: mongo:latest
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
      volumeMounts:
        - name: mongo-volume
          mountPath: /data/db
    volumes:
      - name: mongo-volume
        persistentVolumeClaim:
          claimName: persistentvolumeclaim
